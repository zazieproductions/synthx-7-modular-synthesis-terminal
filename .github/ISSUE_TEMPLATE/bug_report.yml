name: Bug report
description: Report something that is broken or behaving unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide,
        the faster we can reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Press ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and versions (e.g. Chrome 126 on macOS 14).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Any errors shown in the browser developer console, if relevant.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
